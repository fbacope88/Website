<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!--app-head-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfessionalService",
          "@id": "%VITE_SITE_URL%/#business",
          "name": "Creative Web Studio Experts",
          "description": "UK-based premium web design agency delivering high-converting, stunning websites starting from £199. Custom website design, SEO-friendly development, and expert solutions tailored to your brand.",
          "url": "%VITE_SITE_URL%/",
          "email": "creativewebstudioexpert@gmail.com",
          "telephone": "+447907313846",
          "areaServed": {
            "@type": "Country",
            "name": "United Kingdom"
          },
          "priceRange": "££",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "email": "creativewebstudioexpert@gmail.com",
            "availableLanguage": "English"
          },
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Web Design Packages",
            "itemListElement": [
              {
                "@type": "Offer",
                "name": "Basic Website",
                "description": "Single-page, mobile-ready website with a contact form and core SEO setup, live in 48 hours.",
                "price": "199",
                "priceCurrency": "GBP"
              },
              {
                "@type": "Offer",
                "name": "Professional Website",
                "description": "Multi-page website (up to 6 pages) with a blog/news section and analytics set up, live in 72 hours.",
                "price": "399",
                "priceCurrency": "GBP"
              },
              {
                "@type": "Offer",
                "name": "E-Commerce Website",
                "description": "Full online store with Stripe payments and stock/order management, live in 5–7 days.",
                "price": "599",
                "priceCurrency": "GBP"
              }
            ]
          }
        },
        {
          "@type": "WebSite",
          "@id": "%VITE_SITE_URL%/#website",
          "url": "%VITE_SITE_URL%/",
          "name": "Creative Web Studio Experts",
          "description": "Professional web design agency for businesses across the UK.",
          "publisher": {
            "@id": "%VITE_SITE_URL%/#business"
          }
        }
      ]
    }
    </script>
    <script>
      (function () {
        var id = "%VITE_GA_MEASUREMENT_ID%";
        if (!id || id.indexOf("%") === 0) return;
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag("js", new Date());
        gtag("config", id);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
